version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EXTERNAL_API_URL: ${EXTERNAL_API_URL}
      EXTERNAL_API_TOKEN: ${EXTERNAL_API_TOKEN}
      FORCE_CPU_FOR_TF: ${FORCE_CPU_FOR_TF}
      DATABASE_HOST: ${DB_HOST}
      DATABASE_PORT: ${DB_PORT}
    volumes:
      - ./data:/app/data

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    entrypoint: ["/usr/local/bin/entrypoint.sh"]
